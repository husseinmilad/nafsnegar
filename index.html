</style></head><body>
<header><div><h1><img class="lg" src="logo.png" alt="" onerror="this.replaceWith('🌙')"> نفس‌نگار</h1><small>«حاسبوا أنفسکم قبل أن تحاسبوا»</small><div class="th" id="th"></div></div><div class="sc"><small>امتیاز روز</small><br><b id="tot">۰</b></div></header>

<script>
const FA=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);

function jg(y,m,d){let b=new Date(y+621,2,18,12);for(let i=0;i<6;i++){const t=jp(b);if(t.month==1&&t.day==1)break;b=new Date(b.getFullYear(),b.getMonth(),b.getDate()+1,12)}
const off=m<=6?(m-1)*31:186+(m-7)*30;return new Date(b.getFullYear(),b.getMonth(),b.getDate()+off+d-1,12)}

try{S=JSON.parse(localStorage.getItem('nafs_v1'))}catch(e){}

const OB=[['tah','رعایت طهارت',10,'وضوی صحیح|غسل‌های واجب|پاکی بدن از نجاست|پاکی لباس نمازگزار|پاکی مکان نماز|تیمم در صورت نیاز|پرهیز از نجاسات'],

['h1','دیداری (چشم)',5,'نگاه به نامحرم|دیدن محتوای حرام|نگاه تحقیرآمیز|نگاه به حریم خصوصی|نگاه حسادت‌آمیز|دیدن مجالس گناه'],
['h2','شنیداری (گوش)',5,'شنیدن غیبت|موسیقی حرام|شنیدن تهمت و دروغ|استراق سمع|شنیدن سخن لغو'],
['h3','عملی (دست)',5,'آزار و ضرب|تصرف در مال دیگران|رشوه|سرقت|نوشتن مطلب حرام|لمس حرام|خیانت در امانت'],
['h4','رفتاری و حرکتی (پا)',5,'رفتن به مجلس گناه|گام در مسیر ظلم|راه رفتن از روی تکبر|حضور در محل حرام|فرار از وظیفه'],
['h5','شکم',5,'غذای حرام|ربا|مال شبهه‌ناک|مال یتیم|پرخوری|مال بدون خمس'],
['h6','جنسی',5,'نگاه شهوانی|خودارضایی|رابطه نامشروع|فکر و خیال شهوانی|محتوای مبتذل'],
['h7','قوای بدنی (قلب، ذهن، نیت)',5,'ریا|حسد|کینه|تکبر|سوءظن|عُجب|ناامیدی از رحمت|نیت ناپاک|غفلت'],
['h8','پوست و سایر اعضا',5,'لمس نامحرم|آرایش و زینت حرام|پوشش نامناسب|آسیب به بدن|خالکوبی حرام'],
['h9','سبک زندگی',5,'اسراف|قطع رحم|عاق والدین|ظلم اجتماعی|کم‌فروشی|تضییع وقت|ترک امر به معروف|فساد در معامله|ترک جماعت و عبادت']];
const MUS='نماز شب|نماز اول وقت|نوافل یومیه|نماز جماعت|نماز غفیله|تلاوت قرآن|تدبر در قرآن|دعای عهد|زیارت عاشورا|دعای کمیل|ذکر تسبیحات حضرت زهرا|تعقیبات نماز|استغفار صبح|صلوات|ذکر یونسیه|روزه مستحبی|صدقه روزانه|انفاق پنهانی|احسان به والدین|دیدار با ارحام|عیادت بیمار|تشییع جنازه|اطعام نیازمند|کمک به حل مشکل مؤمن|اصلاح بین دو نفر|سلام کردن|خوش‌رویی|مسواک زدن|وضو با طهارت دائمی|خواندن دعای ورود به مسجد|حضور در مسجد|سجده شکر|طلب علم|مطالعه کتاب سودمند|محاسبه نفس شبانه|دعا برای دیگران|عطر زدن|غسل جمعه|زیارت اهل قبور|پاسخ به نیاز دیگران|خواب با وضو|ذکر مأثور خواب|شکرگزاری|صبر بر مشکلات|تبسم|سحرخیزی|درخت‌کاری|قرض‌الحسنه|کمک به یتیم|نیکی به همسایه'.replace(/ /g,' ');
const MAK='پرخوری|خوردن در حال سیری|خوردن با دست چپ|خوابیدن بین‌الطلوعین|خوابیدن در ابتدای شب|خوابیدن به پشت|سخن زیاد|قسم راست بی‌دلیل|عجله در کار|تأخیر در نماز|نماز در حال خواب‌آلودگی|نگاه به آینه در حال نماز|بازی با ریش یا موی صورت|خندیدن بلند|اخم و ترش‌رویی|امتناع از دعوت مؤمن|خوردن غذای داغ|فوت کردن در غذا|خوردن پیاز و سیر خام قبل از مسجد|ایستاده آب خوردن|آب‌ نوشیدن بیش‌ازحد با غذا|سیر‌ نشدن از دنیا|بیکاری|سستی|تنبلی|تأخیر در توبه|حسرت بر گذشته|شکایت از روزگار|سوءظن ناروا|ورود بی‌اجازه|نشستن در راه‌ها|مزاح بیش‌ازحد|تأخیر در پرداخت مزد|امساک در انفاق|ترک مسواک|ترک غسل جمعه|ایستادن در برابر قبله بدون نیاز|تف کردن در مسجد|تأخیر در وفای قرض|اعتماد بر غیرخدا|گفتگو در مسجد درباره دنیا|ولخرجی|خودستایی|زیاده‌روی در شوخی|پرگویی بی‌فایده|نشستن در مجلس گناه|اهمال در ورزش|بیدار‌ماندن بی‌دلیل|دوری از همنشین صالح'.replace(/ /g,' ');
const LIST={mus:MUS,mak:MAK};
const cd=()=>S.days[key(D)]||(S.days[key(D)]={p:[0,0,0,0,0],s:{},c:{}});
const g=(d,k)=>+(d.s[k]||0);
const prs=d=>d.p.reduce((a,v)=>a+(v?PT[v-1][1]:0),0);
const tot=d=>prs(d)+['tah','haq','fast'].reduce((a,k)=>a+g(d,k),0)+HR.reduce((a,c)=>a+g(d,c[0]),0)+g(d,'mus')-g(d,'mak');
const isR=d=>d.ram!==undefined?d.ram:+hf.format(D)==9;
const upd=()=>{document.getElementById('tot').textContent=FA(Math.round(tot(cd())*10)/10)};
function sp(i,v){const d=cd();d.p[i]=d.p[i]==v?0:v;save();R()}
function sv(k,v){const d=cd();d.s[k]=+v;save();const e=document.getElementById('v_'+k);if(e)e.textContent=FA(v)+e.dataset.m;upd()}

function rm(v){cd().ram=v;save();R()}
function nav(n){D=new Date(D.getFullYear(),D.getMonth(),D.getDate()+n,12);R()}
function gd(){D=jg(+ys.value,+ms.value,+ds.value);R()}
function addC(s){const e=document.getElementById('cu_'+s);const t=e.value.trim();if(!t)return;S.cu[s].push(t);save();R()}

const ch=(id,t,neg)=>`<button class="chip ${cd().c[id]?'on':''} ${neg?'neg':''}" onclick="tg('${id}')">${t}</button>`;
function cat(c,hint){const d=cd(),v=g(d,c[0]);return `<div class="card"><h3>${c[1]}<small id="v_${c[0]}" data-m=" از ${FA(c[2])}">${FA(v)} از ${FA(c[2])}</small></h3>${hint?`<p class="hint">${hint}</p>`:''}<input type="range" min="0" max="${c[2]}" step="1" value="${v}" oninput="sv('${c[0]}',this.value)"><div class="chips">${c[3].split('|').map((t,i)=>ch(c[0]+'.'+i,t,hint)).join('')}</div></div>`}
function sec(s,title,sign){const d=cd(),it=LIST[s].split('|'),v=g(d,s);
return `<div class="card"><h3>${title}<small id="v_${s}" data-m="">${sign}${FA(v)}</small></h3><p class="hint">موارد انجام‌شده را علامت بزنید و امتیاز را خودتان تعیین کنید.</p><input type="number" min="0" step="0.5" value="${v}" oninput="sv('${s}',this.value||0)"><div class="chips">${it.map((t,i)=>ch(s+'.'+i,t,s=='mak')).join('')}${S.cu[s].map((t,i)=>ch(s+'.c'+i,t+' ★',s=='mak')).join('')}</div></div>
<div class="card"><h3>افزودن مورد دلخواه (سایر)</h3><div class="row"><input type="text" id="cu_${s}" placeholder="عنوان..."><button class="btn" onclick="addC('${s}')">افزودن</button></div>${S.cu[s].length?`<div class="chips">${S.cu[s].map((t,i)=>`<button class="chip" onclick="delC('${s}',${i})">✕ ${t}</button>`).join('')}</div>`:''}</div>`}
function obl(){const d=cd();let h=`<div class="card"><h3>نمازهای یومیه<small>${FA(prs(d))} از ۳۰</small></h3>`;

h+='</div>'+cat(OB[0])+cat(OB[1]);
h+=`<div class="card"><label><input type="checkbox" ${isR(d)?'checked':''} onchange="rm(this.checked)"> امروز از ماه مبارک رمضان است</label></div>`;
if(isR(d))h+=cat(OB[2]);return h}
function hrm(){const d=cd(),s=HR.reduce((a,c)=>a+g(d,c[0]),0);return `<div class="card"><h3>ترک محرمات<small>${FA(s)} از ۵۰</small></h3><p class="hint">برای هر دسته، امتیاز پاکی (۵ = بدون گناه) را خودتان بدهید و گناهان رخ‌داده را فقط جهت اطلاع علامت بزنید.</p></div>`+HR.map(c=>cat(c,'گناهان رخ‌داده:')).join('')}

function dash(){const days=[];for(let i=29;i>=0;i--){const x=new Date(D.getFullYear(),D.getMonth(),D.getDate()-i,12);days.push(S.days[key(x)]||null)}
const T=days.map(d=>d?tot(d):0),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
